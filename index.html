<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BR查詢">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0b6b4f" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a3326" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<title>BR 班號查詢</title>
<style>
  :root {
    --bg:#f2f2f7; --surface:#fff; --surface-2:#e9e9ee; --text:#0a0a0a; --muted:#636366;
    --line:#d8d8de; --accent:#0b6b4f; --on-accent:#fff; --accent-soft:#e3f1ec;
    --warn-bg:#fff4e0; --warn:#8a4b00; --tag-bg:#fde8e6; --tag:#a1251b;
    --seg-on:#fff; --fav:#c27c0e; --radius:16px; --shadow:0 1px 2px rgb(0 0 0 / .06), 0 1px 1px rgb(0 0 0 / .03);
    --hero:#0b6b4f; --hero-mint:#4cd6a0; --on-hero:#fff;
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#000; --surface:#1c1c1e; --surface-2:#2c2c2e; --text:#f5f5f7; --muted:#a1a1a6;
      --line:#38383a; --accent:#4cd6a0; --on-accent:#00281c; --accent-soft:#0f2e24;
      --warn-bg:#3a2a10; --warn:#ffcf87; --tag-bg:#3d1714; --tag:#ffb4ab; --shadow:none; --seg-on:#636366; --fav:#ffc94d;
      --hero:#0a3326;
    }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; }
  body {
    margin:0; min-height:100dvh; background:var(--bg); color:var(--text);
    font:16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }
  button, select, input { font:inherit; color:inherit; }
  button { cursor:pointer; touch-action:manipulation; }
  :focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  svg { width:20px; height:20px; flex:none; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

  .hero { background:var(--hero); color:var(--on-hero); padding:calc(env(safe-area-inset-top) + 20px) 16px 44px; }
  .hero > div { max-width:560px; margin:auto; }
  .hero h1 { margin:0; display:flex; align-items:center; gap:10px; font-size:32px; line-height:1.15; font-weight:800; letter-spacing:-.02em; }
  .hero h1 span { background:var(--hero-mint); color:#00281c; padding:2px 12px 3px; border-radius:12px; letter-spacing:.02em; }
  .hero p { margin:8px 0 0; font-size:13px; opacity:.85; }
  .wrap { max-width:560px; margin:auto; padding:0 16px calc(env(safe-area-inset-bottom) + 32px); }

  .panel { margin-top:-28px; position:relative; background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); padding:4px 16px 14px; }
  .field-label { display:block; font-size:13px; color:var(--muted); padding-top:10px; }
  .cityrow { display:flex; align-items:center; gap:4px; }
  .select { position:relative; flex:1; min-width:0; }
  .star {
    width:44px; height:44px; border:0; border-radius:12px; background:none; color:var(--muted);
    display:grid; place-items:center; transition:color .15s, scale .15s var(--ease);
  }
  .star svg { width:26px; height:26px; }
  .star[aria-pressed="true"] { color:var(--fav); }
  .star[aria-pressed="true"] svg, .chip .fav { fill:currentColor; }
  .star:active { scale:.85; }
  .chip .fav { width:14px; height:14px; margin:-2px 4px 0 -4px; vertical-align:middle; color:var(--fav); stroke:none; }
  .chip[aria-pressed="true"] .fav { color:inherit; }
  .airport { margin-top:12px; }
  .airport > span { display:block; font-size:13px; color:var(--muted); padding-left:4px; }
  .chips .sep { width:1px; align-self:stretch; margin:4px 2px; background:var(--line); }
  .select select {
    appearance:none; -webkit-appearance:none; width:100%; border:0; background:none;
    font-size:24px; font-weight:700; padding:2px 32px 6px 0; min-height:44px;
  }
  .select svg { position:absolute; right:0; top:50%; translate:0 -50%; color:var(--muted); pointer-events:none; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
  .chip {
    min-height:36px; padding:6px 14px; border-radius:999px; border:1px solid var(--line);
    background:var(--surface); font-size:15px; transition:background .15s, color .15s, border-color .15s;
  }
  .chip[aria-pressed="true"] { background:var(--accent); color:var(--on-accent); border-color:var(--accent); font-weight:600; }
  .chip:active { scale:.96; }

  .seg { display:grid; grid-template-columns:1fr 1fr; gap:4px; margin-top:16px; padding:4px; background:var(--surface-2); border-radius:14px; }
  .seg button {
    border:0; border-radius:11px; background:none; min-height:52px; padding:6px 8px; line-height:1.25;
    transition:background .2s var(--ease), box-shadow .2s var(--ease);
  }
  .seg button b { display:block; font-size:16px; }
  .seg button span { font-size:13px; color:var(--muted); white-space:nowrap; }
  .seg button[aria-selected="true"] { background:var(--seg-on); box-shadow:0 1px 3px rgb(0 0 0 / .12); }
  .seg button[aria-selected="false"] b { color:var(--muted); }
  .seg button[aria-selected="true"] span { color:var(--text); opacity:.75; }

  .datebar { display:flex; align-items:center; gap:8px; margin-top:12px; }
  .datebar .step {
    width:48px; height:48px; border-radius:14px; border:0; background:var(--surface); box-shadow:var(--shadow);
    display:grid; place-items:center;
  }
  .datebar .step:disabled { opacity:.4; cursor:default; }
  .datebar .step:not(:disabled):active { scale:.94; }
  .date {
    position:relative; flex:1; height:48px; border-radius:14px; background:var(--surface); box-shadow:var(--shadow);
    display:flex; align-items:center; justify-content:center; gap:8px; font-weight:600; font-size:17px;
  }
  .date small { font-weight:500; font-size:13px; color:var(--accent); background:var(--accent-soft); padding:1px 8px; border-radius:999px; }
  .date input { position:absolute; inset:0; width:100%; height:100%; opacity:0; border:0; cursor:pointer; }
  .date .ph { color:var(--muted); font-weight:500; }
  .clear { border:0; background:none; color:var(--muted); font-size:14px; padding:0 4px; min-height:44px; }

  .note {
    display:flex; gap:10px; align-items:flex-start; margin-top:12px; padding:12px 14px;
    border-radius:14px; background:var(--warn-bg); color:var(--warn); font-size:14px;
  }

  .list { margin-top:12px; display:grid; gap:10px; }
  .flight {
    display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:14px; width:100%; text-align:left;
    border:0; background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); padding:12px 14px 12px 16px;
    transition:scale .15s var(--ease), background .15s;
    animation:in .25s var(--ease) both; animation-delay:calc(var(--i) * 30ms);
  }
  .flight:active { scale:.98; background:var(--surface-2); }
  .no { display:flex; flex-direction:column; line-height:1; min-width:84px; }
  .no small { font-size:11px; font-weight:700; letter-spacing:.12em; color:var(--muted); }
  .no b { font-size:40px; font-weight:800; letter-spacing:-.01em; font-variant-numeric:tabular-nums; color:var(--accent); margin-top:2px; }
  .times { font-size:18px; font-weight:700; font-variant-numeric:tabular-nums; }
  .times sup { font-size:11px; color:var(--muted); margin-left:1px; }
  .route { font-size:14px; color:var(--muted); }
  .tag { display:inline-block; margin-top:4px; font-size:12px; padding:1px 8px; border-radius:6px; background:var(--tag-bg); color:var(--tag); }
  .copy { color:var(--muted); }

  .empty { margin-top:12px; text-align:center; padding:28px 16px; background:var(--surface); border-radius:var(--radius); color:var(--muted); }
  .empty svg { width:36px; height:36px; }
  .empty p { margin:8px 0 14px; color:var(--text); font-weight:600; }
  .btn { min-height:44px; padding:10px 18px; border-radius:12px; border:0; background:var(--accent); color:var(--on-accent); font-weight:600; }

  footer { margin-top:24px; text-align:center; color:var(--muted); font-size:12px; }

  .toast {
    position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 24px); translate:-50% 16px; opacity:0;
    background:var(--text); color:var(--bg); padding:10px 18px; border-radius:999px; font-weight:600; font-size:15px;
    display:flex; gap:8px; align-items:center; pointer-events:none; transition:opacity .2s var(--ease), translate .2s var(--ease);
  }
  .toast.show { opacity:1; translate:-50% 0; }
  @keyframes in { from { opacity:0; translate:0 6px; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
</style>
</head>
<body>
<header class="hero">
  <div>
    <h1><span>BR</span>班號查詢</h1>
    <p id="season"></p>
  </div>
</header>
<div class="wrap">

  <section class="panel" aria-label="航點">
    <label class="field-label" for="city">航點</label>
    <div class="cityrow">
      <div class="select">
        <select id="city"></select>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <button class="star" id="star" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg></button>
    </div>
    <div class="chips" id="recent" aria-label="最愛與最近查過"></div>
  </section>

  <div class="seg" role="tablist" aria-label="去程或回程">
    <button role="tab" id="tab-go" aria-controls="results"><b>去程</b><span></span></button>
    <button role="tab" id="tab-back" aria-controls="results"><b>回程</b><span></span></button>
  </div>

  <div class="datebar">
    <button class="step" id="prev" aria-label="前一天"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
    <label class="date" id="dateBox">
      <span id="dateText"></span>
      <input type="date" id="date" aria-label="日期">
    </label>
    <button class="step" id="next" aria-label="後一天"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
  </div>

  <div class="airport" id="originWrap" hidden>
    <span id="originLabel"></span>
    <div class="chips" id="origin" role="group" aria-labelledby="originLabel"></div>
  </div>

  <main id="results" role="tabpanel" aria-live="polite"></main>

  <footer>資料來源：長榮航空官網時刻表，非官方工具。實際航班以訂位系統為準。<br>點班號卡片可複製號碼</footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

const TW = { TPE:'桃園', TSA:'台北松山', KHH:'高雄', RMQ:'台中' };

const AP = { NRT:'成田', HND:'羽田', ICN:'仁川', GMP:'金浦', PVG:'浦東', SHA:'虹橋', KIX:'關西', UKB:'神戶' };

};

// ---- 日期工具（一律用當地日期字串 YYYY-MM-DD）
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const fmt = dt => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
const addDays = (s, n) => { const dt = parse(s); dt.setDate(dt.getDate() + n); return fmt(dt); };
const short = s => { const dt = parse(s); return `${dt.getMonth() + 1}/${dt.getDate()}（${WK[dt.getDay()]}）`; };
const today = fmt(new Date());

// ---- 狀態
const S = {
  city: localStorage.city in DATA.cities ? localStorage.city : '東京',
  tab: 'go',
  date: { go: today, back: '' },
  // 去程看出發機場、回程看抵達機場，各自獨立（去回可不同機場）
  origin: { go: localStorage.originGo || '', back: localStorage.originBack || '' },
  recent: JSON.parse(localStorage.recent || '[]').filter(c => c in DATA.cities),
  favs: JSON.parse(localStorage.favs || '[]').filter(c => c in DATA.cities),
};

const twSide = (f, outbound) => outbound ? f[1] : f[2];
// 這個航點、這個方向有哪些台灣機場
const twAirports = outbound => {
  const here = new Set(DATA.flights.filter(f => f[6] === S.city).map(f => twSide(f, outbound)));
  return Object.keys(TW).filter(c => here.has(c));
};
// 實際生效的篩選：該航點沒有這個機場、或只有一個機場時視為「全部」（不改動使用者的設定）
const activeAp = outbound => {
  const a = twAirports(outbound), v = S.origin[outbound ? 'go' : 'back'];
  return a.length > 1 && a.includes(v) ? v : '';
};
function flightsFor(dateStr, outbound) {
  const wd = parse(dateStr).getDay(), ap = activeAp(outbound);
  return DATA.flights
    .filter(f => f[6] === S.city && twSide(f, outbound) in TW && f[5].includes(wd))
    .filter(f => !ap || twSide(f, outbound) === ap)
    .sort((a, b) => a[3].localeCompare(b[3]));
}

const place = c => TW[c] ? `${TW[c]} ${c}` : AP[c] ? `${AP[c]} ${c}` : c;
const card = (f, i) => {
  const [no, o, d, dep, arr, , , note] = f, [at, plus] = arr.split('+');
  return `<button class="flight" style="--i:${i}" data-no="${no}" aria-label="BR${no}，${place(o)} ${dep} 出發，${place(d)} ${at}${plus ? ` 隔 ${plus} 天` : ''} 抵達。點一下複製班號">
    <span class="no"><small>BR</small><b>${no}</b></span>
    <span><span class="times">${dep} → ${at}${plus ? `<sup>+${plus}</sup>` : ''}</span><br>
      <span class="route">${place(o)} → ${place(d)}</span>${note ? `<br><span class="tag">${note}</span>` : ''}</span>
    <span class="copy">${icon.copy}</span></button>`;
};

function render() {
  const outbound = S.tab === 'go';
  const dateStr = S.date[S.tab];
  localStorage.city = S.city;

  // 航點選單＋最愛（固定在前）＋最近查過
  $('city').value = S.city;
  const isFav = S.favs.includes(S.city);
  $('star').setAttribute('aria-pressed', isFav);
  $('star').setAttribute('aria-label', isFav ? `將${S.city}移出最愛` : `將${S.city}加入最愛`);
  const others = S.recent.filter(c => !S.favs.includes(c)).slice(0, 4);
  const chip = (c, fav) => `<button class="chip" data-city="${c}" aria-pressed="${c === S.city}">${fav ? icon.star : ''}${c}</button>`;
  $('recent').innerHTML = S.favs.length || others.length > 1
    ? S.favs.map(c => chip(c, true)).join('') + (S.favs.length && others.length ? '<span class="sep" aria-hidden="true"></span>' : '') + others.map(c => chip(c)).join('')
    : '';

  // 台灣端機場篩選（依目前分頁）：該方向只有一個機場就不顯示
  const tws = twAirports(outbound), cur = activeAp(outbound);
  $('originWrap').hidden = tws.length < 2;
  $('originLabel').textContent = outbound ? '出發機場' : '抵達機場';
  $('origin').innerHTML = [['', '全部'], ...tws.map(c => [c, TW[c]])].map(([c, n]) =>
    `<button class="chip" data-origin="${c}" aria-pressed="${cur === c}">${n}</button>`).join('');

  // 分頁
  for (const t of ['go', 'back']) {
    const b = $('tab-' + t), d = S.date[t], ap = activeAp(t === 'go');
    b.setAttribute('aria-selected', S.tab === t);
    b.tabIndex = S.tab === t ? 0 : -1;
    b.querySelector('b').textContent = (t === 'go' ? '去程' : '回程') + (ap ? ` · ${TW[ap]}` : '');
    b.querySelector('span').textContent = d ? `${short(d)} · ${flightsFor(d, t === 'go').length} 班` : '未選日期';
  }

  // 日期列
  const min = outbound ? today : (S.date.go > today ? S.date.go : today);
  $('date').value = dateStr;
  $('date').min = min;
  $('next').disabled = !dateStr;
  $('prev').disabled = !dateStr || dateStr <= min;
  const rel = { [today]: '今天', [addDays(today, 1)]: '明天' }[dateStr];
  $('dateText').innerHTML = dateStr
    ? `${short(dateStr)}${rel ? ` <small>${rel}</small>` : ''}`
    : `<span class="ph">選擇${outbound ? '去' : '回'}程日期</span>`;

  // 結果
  if (!dateStr) { $('results').innerHTML = ''; return; }
  const warn = dateStr < DATA.from || dateStr > DATA.to
    ? `<div class="note" role="note">${icon.alert}<span>這天超出目前班表有效期間（${DATA.from} ～ ${DATA.to}），班表可能已換季，結果僅供參考。</span></div>` : '';
  const fs = flightsFor(dateStr, outbound);
  let body;
  if (fs.length) body = `<div class="list">${fs.map(card).join('')}</div>`;
  else {
    // 找前後 7 天內最近有班次的日子（不早於可選的最早日）
    let near = '';
    for (let k = 1; k <= 7 && !near; k++)
      for (const n of [k, -k]) {
        const d = addDays(dateStr, n);
        if (!near && d >= min && flightsFor(d, outbound).length) near = d;
      }
    body = `<div class="empty">${icon.plane}<p>這天沒有 BR 班次</p>${near ? `<button class="btn" data-goto="${near}">改查 ${short(near)}</button>` : ''}</div>`;
  }
  $('results').innerHTML = warn + body;
}

function setCity(c) {
  S.city = c;
  S.recent = [c, ...S.recent.filter(x => x !== c)].slice(0, 5);
  localStorage.recent = JSON.stringify(S.recent);
  render();
}
function setDate(v) {
  S.date[S.tab] = v;
  if (S.tab === 'go' && S.date.back && v > S.date.back) S.date.back = '';
  render();
}

let toastTimer;
function toast(html) {
  $('toast').innerHTML = html;
  $('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.remove('show'), 1800);
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch { const t = Object.assign(document.createElement('textarea'), { value: text }); document.body.append(t); t.select(); document.execCommand('copy'); t.remove(); }
  toast(`${icon.check}已複製 ${text}`);
}

// ---- 事件
const md = s => s ? s.slice(5).replace('-', '/').replace(/^0|(?<=\/)0/g, '') : '';
$('season').textContent = `冬季班表・有效至 ${DATA.to.slice(0, 4)}/${md(DATA.to)}・${md(DATA.fetched)} 更新`;
const groups = {};
for (const [c, r] of Object.entries(DATA.cities)) (groups[r] ||= []).push(c);
$('city').innerHTML = Object.entries(groups).map(([r, cs]) =>
  `<optgroup label="${r}">${cs.map(c => `<option>${c}</option>`).join('')}</optgroup>`).join('');
if (!S.recent.length) S.recent = [S.city];

$('city').addEventListener('change', e => setCity(e.target.value));
$('star').addEventListener('click', () => {
  const on = !S.favs.includes(S.city);
  S.favs = on ? [...S.favs, S.city] : S.favs.filter(c => c !== S.city);
  localStorage.favs = JSON.stringify(S.favs);
  render();
  toast(on ? `${icon.check}已加入最愛　${S.city}` : `已移出最愛　${S.city}`);
});
$('date').addEventListener('change', e => e.target.value && setDate(e.target.value));
$('prev').addEventListener('click', () => setDate(addDays(S.date[S.tab], -1)));
$('next').addEventListener('click', () => setDate(addDays(S.date[S.tab], 1)));
for (const t of ['go', 'back']) $('tab-' + t).addEventListener('click', () => {
  S.tab = t;
  if (t === 'back' && !S.date.back && S.date.go) S.date.back = addDays(S.date.go, 3); // ponytail: 預設回程 = 去程 +3 天
  render();
});
document.querySelector('.seg').addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { $('tab-' + (S.tab === 'go' ? 'back' : 'go')).click(); $('tab-' + S.tab).focus(); }
});
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.city) setCity(b.dataset.city);
  else if ('origin' in b.dataset) {
    S.origin[S.tab] = b.dataset.origin;
    localStorage[S.tab === 'go' ? 'originGo' : 'originBack'] = b.dataset.origin;
    render();
  }
  else if (b.dataset.goto) setDate(b.dataset.goto);
  else if (b.dataset.no) copy(b.dataset.no);
});
render();
</script>
</body>
</html>
