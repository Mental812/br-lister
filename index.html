<style>

  .note { display:inline-block; font-size:12px; background:#fdecea; color:#b42318; border-radius:6px; padding:0 6px; margin-left:4px; }
  .empty { color:var(--mute); font-size:14px; }

  const warn = dateStr < DATA.from || dateStr > DATA.to ? '<div class="warn">⚠ 這天超出目前班表的有效期間，班表可能已換季，請叫我更新。</div>' : '';
  const cards = fs.map(f => `<div class="card"><div class="no">${f[0]}</div><div class="info">
      <b>${f[1]} → ${f[2]}</b>${f[7] ? `<span class="note">${f[7]}</span>` : ''}<br>${f[3]} – ${f[4]}</div></div>`).join('')
    || '<div class="empty">這天沒有 BR 班次</div>';
  return `<h2>${outbound ? '去程' : '回程'}　${m}/${d}（${WK[wd]}）</h2>${warn}${cards}`;
}

function render() {
  localStorage.city = $('city').value;
  $('out').innerHTML = list($('go').value, true) + list($('back').value, false);
}
['city', 'go', 'back'].forEach(id => $(id).addEventListener('input', render));
render();
</script>
</body>
</html>
